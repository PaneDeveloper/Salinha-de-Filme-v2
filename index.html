<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Cinema Virtual V2</title>

<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at top, #3a260d, #050505 60%);

    color: white;

}


/* efeito de luz no fundo */

body::before {

    content: "";

    position: fixed;

    width: 300px;
    height: 300px;

    background: #ff9500;

    filter: blur(140px);

    opacity: 0.25;

}


/* vidro */

.card {

    width: 460px;

    padding: 45px;

    text-align: center;


    background:
        rgba(255,255,255,0.08);


    backdrop-filter:
        blur(18px);


    -webkit-backdrop-filter:
        blur(18px);


    border-radius: 28px;


    border:
        1px solid rgba(255,255,255,0.15);


    box-shadow:

        0 25px 60px rgba(0,0,0,0.7),

        inset 0 1px 20px rgba(255,255,255,0.08);

}



/* logo */

.logo {

    font-size: 65px;

    margin-bottom: 10px;


    filter:

        sepia(1)
        saturate(12)
        hue-rotate(5deg)
        brightness(1.2)

        drop-shadow(
            0 0 25px #ff9500
        );

}



h1 {

    margin: 5px;

    font-size: 34px;

    color: #ff9d00;

}



.version {

    color: #bbb;

    font-size: 15px;

}



p {

    margin-top: 30px;

    color: #ddd;

    line-height: 1.7;

}



.button {


    display: inline-block;


    margin-top: 30px;


    padding: 16px 35px;


    background:

        linear-gradient(
            135deg,
            #ffc04d,
            #ff7200
        );


    color: #111;


    font-weight: bold;


    text-decoration: none;


    border-radius: 16px;



    box-shadow:

        0 10px 35px rgba(255,140,0,0.45);



    transition: .25s;


}



.button:hover {


    transform:

        translateY(-4px);


    box-shadow:

        0 15px 45px rgba(255,140,0,0.65);


}



.footer {

    margin-top: 25px;

    font-size: 12px;

    color: #999;

}
    .developer {

    margin-top: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    color: #aaa;

    font-size: 13px;

}


.developer img {

    width: 28px;

    height: 28px;

    border-radius: 8px;

    object-fit: cover;

    box-shadow:
        0 0 15px rgba(255,150,0,0.4);

}



</style>

</head>


<body>


<div class="card">


    <div class="logo">
        🎬
    </div>


    <h1>
        Cinema Virtual
    </h1>


    <div class="version">
        Versão 2
    </div>



    <p>

        Esta versão hospedada no GitHub não está mais disponível.

        <br><br>

        Para continuar usando o aplicativo,
        acesse a versão mais recente do Cinema Virtual.

    </p>



    <a class="button"
       href="https://cinema-virtual-v4.base44.app/v2.html">

        Abrir versão atual

    </a>
<div class="developer">

    <img src="icon.ico" alt="Pane Developer">

    <span>Pane Developer</span>

</div>
    


</div>


</body>

</html>
